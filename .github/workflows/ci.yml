name: ci

on:
  push: 
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: set up nodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: install dependencies
        run: npm install
      
      - name: check application can start
        run: node --check server.js